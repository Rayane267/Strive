name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les runs précédents sur la même branche/PR pour économiser des minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pas de `.env` à écrire : en env `test`, react-native-dotenv est désactivé
      # (babel.config.js) et `@env` est résolu vers __mocks__/env.js. Les tests
      # sont donc hermétiques.

      # Non-bloquant pour l'instant : ~17 erreurs lint préexistantes dans le code
      # applicatif (imports inutilisés, deps de hooks). Les tests restent la
      # barrière dure ci-dessous. À repasser en bloquant après nettoyage.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Non-bloquant pour l'instant : 2 erreurs de types préexistantes dans
      # AnalyticsScreen.tsx (champ `fuelCost` manquant). À repasser en bloquant
      # une fois corrigées.
      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Tests
        run: npm test -- --ci --coverage --maxWorkers=2

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
