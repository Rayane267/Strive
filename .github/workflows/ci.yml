name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les runs précédents sur la même branche/PR pour économiser des minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # react-native-dotenv inline les valeurs `@env` au transform Babel. Les
      # tests unitaires n'appellent aucun service réseau réel (fetch est mocké),
      # mais certains modules gardent une early-return si les clés sont absentes.
      # On fournit donc des valeurs factices NON vides — aucune n'est un secret.
      - name: Write test .env
        run: |
          cat > .env <<'EOF'
          PUBLIC_SUPABASE_URL=https://test.supabase.co
          PUBLIC_SUPABASE_KEY=test-anon-key
          TOMTOM_API_KEY=test-tomtom-key
          REVENUECAT_API_KEY_ANDROID=test-rc-android
          REVENUECAT_API_KEY_IOS=test-rc-ios
          SENTRY_DSN=
          GOOGLE_WEB_CLIENT_ID=test-google-web
          GOOGLE_IOS_CLIENT_ID=test-google-ios
          EOF

      # Non-bloquant pour l'instant : ~17 erreurs lint préexistantes dans le code
      # applicatif (imports inutilisés, deps de hooks). Les tests restent la
      # barrière dure ci-dessous. À repasser en bloquant après nettoyage.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Non-bloquant pour l'instant : 2 erreurs de types préexistantes dans
      # AnalyticsScreen.tsx (champ `fuelCost` manquant). À repasser en bloquant
      # une fois corrigées.
      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Tests
        run: npm test -- --ci --coverage --maxWorkers=2

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
