# Identité du projet Sentry, lue par sentry-cli pendant le build.
#
# ⚠️ PAS DE `auth.token` ICI. Le wizard l'y écrit par défaut, mais ce fichier est
# suivi par git : le jeton donne l'écriture sur le projet Sentry, il n'a rien à
# faire dans le dépôt. Il est fourni au build par la variable d'environnement
# SENTRY_AUTH_TOKEN, stockée chiffrée côté EAS :
#
#   eas secret:create --name SENTRY_AUTH_TOKEN --value <jeton> --type string
#
# Si tu relances le wizard, retire à nouveau la ligne auth.token qu'il ajoute.

defaults.org=strive-pf
defaults.project=react-native

defaults.url=https://sentry.io/
